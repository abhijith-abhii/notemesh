<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteMesh</title><link rel="stylesheet" href="/static/style.css"></head><body><header><small>Software engineering / shared workspace</small><h1>NoteMesh</h1><p>Live notes with explicit conflict protection and a persistent revision history.</p></header><main><div class="workspace"><aside class="panel"><label for="room">Room</label><input id="room" value="study-room" pattern="[a-z0-9-]{1,40}"><label for="author">Your name</label><input id="author" value="Student" maxlength="40"><button id="join">Join room</button><button id="reload" class="secondary">Load latest (replaces draft)</button><button id="export" class="secondary">Export Markdown</button><p>Open this room in a second tab. Saves arrive live. Conflicting drafts stay in your editor.</p><p id="connection" role="status"></p></aside><section><div class="panel"><label for="note">Shared note</label><textarea id="note" style="min-height:360px" maxlength="50000"></textarea><button id="save">Save revision</button><p id="status" role="status" aria-live="polite"></p></div><div class="panel"><h2>Revision history</h2><div id="history"></div></div></section></div></main><script src="/static/notes.js"></script></body></html>
